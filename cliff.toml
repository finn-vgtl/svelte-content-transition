# Drafts CHANGELOG.md entries from Conventional Commits; see AGENTS.md for the release flow.
# `pnpm changelog` prints the next version's section. The draft is pasted into CHANGELOG.md
# and edited by hand there, so the changelog is never regenerated as a whole.

[changelog]
body = """
{% if version %}\
	## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
	## [Unreleased]
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### Breaking changes

{% for commit in breaking %}\
	- {{ commit.breaking_description | default(value=commit.message) | replace(from="\n", to=" ") | upper_first }}
{% endfor %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
	- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
# A breaking change always reaches the changelog, even under a type that is skipped below.
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# Only changes that reach package users. The HTML comments order the groups and are stripped.
commit_parsers = [
	{ message = "^[a-z]+(\\(site\\))!?:", skip = true },
	{ message = "^feat", group = "<!-- 0 -->Added" },
	{ message = "^perf", group = "<!-- 1 -->Changed" },
	{ message = "^revert", group = "<!-- 1 -->Changed" },
	{ message = "^fix", group = "<!-- 2 -->Fixed" },
	{ message = "^(docs|test|chore|ci|build|style|refactor)", skip = true },
]

# While the major version is 0, a breaking change bumps MINOR, like a feature.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
